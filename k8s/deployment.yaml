apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-test-roberto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gke-test-roberto
  template:
    metadata:
      labels:
        app: gke-test-roberto
    spec:
      containers:
      - name: gke-test-roberto
        image: {{.Values.image}}
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gke-test-roberto-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: gke-test-roberto
